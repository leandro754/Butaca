spring.application.name=Butaca
spring.config.import=optional:file:./secrets/mail.properties

# SMTP is disabled until configured locally; no fake successful delivery.
butaca.mail.enabled=${MAIL_ENABLED:false}
butaca.mail.from=${MAIL_FROM:}
butaca.mail.reply-to=${MAIL_REPLY_TO:contact@leandro754.moe}
butaca.mail.test-recipient=${MAIL_TEST_RECIPIENT:contact@leandro754.moe}
butaca.mail.public-url=${BUTACA_PUBLIC_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# Perfil activo por defecto: demo (H2 en memoria).
# Para usar PostgreSQL, configurar SPRING_PROFILES_ACTIVE=prod o pasar variables de entorno DB_URL, DB_USERNAME, DB_PASSWORD.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}

# PostgreSQL (para entorno de producción o desarrollo con base externa)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/butaca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${PORT:8081}

